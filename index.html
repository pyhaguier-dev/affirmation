
     
       <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
    
        
<title>Affirmations</title>
  
<style>

body{
    margin:0;
    overflow:hidden;
    background:white;
    font-family:Arial,sans-serif;
}



/* SPHERE */


#sphere{
    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100vh;

    overflow:hidden;
}
 


.sphereItem{
    position:absolute;
    left:50%;
    transform:translate(-50%,-50%);
    white-space:nowrap;

}


#openTime {
   
 position: fixed;
    bottom: 2px;
    right: 5px;
    font-size: 4px;
    color: white;
    opacity: 0.7;

}

</style>
</head>

<body>


<div id="sphere"></div>
<div id="openTime"></div>

<script>

// ======================================
// DATA
// ======================================
const numbers = ["L'Univers Infini dans lequel je me trouve est complet et parfait, et ma vie évolue","constamment. Il n'existe ni début ni fin, mais seulement un cycle éternel de","substances et d'expérience.","Rien dans la vie n'est statique, car chaque instant se manifeste par sa nouveauté","et dans toute sa fraîcheur. Je suis UN avec la Puissance qui ma créé, et qui","m'a donné le pouvoir de créer mes propres expériences, bien précises, et","toujours merveilleusement adaptées pour mon évolution qui est ce qui reste unique","Je me réjouis de savoir que je suis le maître de mon esprit. Chaque instant de la","vie est un nouveau départ et me donne l'occasion de me démarquer du passé","Ce moment même est un point de départ pour moi, ici et maintenant.","Et tout est bien dans le monde qui est le mien.", "L'Univers infini dans lequel je me trouve est","complet et parfait. Je crois en une puissaance","qui m'est infiniment supérieure, qui m'habite","à chaque instant du jour. Je m'ouvre à la","sagesse intérieure, sachant qu'il n'existe","qu'une intelligence dans cet univers. De cette","intelligence émanent toutes les réponses,","toutes les solutions, toutes les guérisons et","toutes les nouvelles créations. J'ai confiance","en cette puissance et intelligence car je sais","que tout ce que je dois connaitre me sera","révélé et que tout ce dont j'aurai besoin","me sera donné en temps et lieux voulus.","Tout est bien dans le monde qui est le mien","J’accueille ce nouveau jour avec un cœur ouvert et reconnaissant.","Je suis prêt à savourer chaque instant et à donner le meilleur de moi-même.","Je pose l’intention d’agir en ayant conscience que mon être est complet et parfait.","Je me rappelle que je suis digne d’amour, de bonheur et de réussite.","Je suis prêt à laisser partir la rancœur, la critique, la peur et la culpabilité,"," pour laisser toute place au pardon, à l’acceptation et à l’amour inconditionnel.","Je sais que chaque défi que je rencontrerai aujourd’hui, sera une opportunité ","pour grandir, apprendre et m’épanouir.","J’accepte ces défis avec calme et confiance, sachant que je suis aimé et soutenu par l’Univers.","Je suis rempli de gratitude et de reconnaissance pour la santé, l’amour,"," l’abondance et la puissance créative qui m’habitent.","Je m’aime, je m’approuve, et je me laisse joyeusement guider par mon intuition."]
    // ======================================

const colors = [

    "red",
    "orange",
    "yellow",
    "green",
    "blue",
    "indigo",
    "violet"
    
];

// ======================================
// SPHERE
// ======================================

const levelCount = 33;

let sphereItems = [];
let sequenceForward = false;


let phase = Math.PI;



let colorIndex = 0;
let previousDirection = 1;

// ======================================
// CREATE ITEM
// ======================================
function nextIndex(i){

    return (
        i + 1
    ) % numbers.length;
}

function prevIndex(i){

    return (
        i - 1 +
        numbers.length
    ) % numbers.length;
}
function createTopItem(){

    let newIndex;

    if(
        sphereItems.length === 0
    ){

        // Start from the LAST text
        newIndex =
            numbers.length - 1;

    }
    else{

        newIndex =
            prevIndex(
                sphereItems[0].index
            );
    }

    sphereItems.unshift({

        index:
            newIndex,

        value:
            String(
                numbers[newIndex]
            ),

        color:
            colors[colorIndex],

        level:
            0

    });

    colorIndex =
        (colorIndex + 1)
        %
        colors.length;

 
}

function createBottomStartItem(){

    const newIndex = 0;

    sphereItems.push({

        index:
            newIndex,

        value:
            String(
                numbers[newIndex]
            ),

        color:
            colors[colorIndex],

        level:
            levelCount - 1

    });

    colorIndex =
        (
            colorIndex + 1
        )
        %
        colors.length;
}
// ======================================
// DRAW
// ======================================



function drawSphere(){

    const sphere =
        document.getElementById(
            "sphere"
        );

    sphere.innerHTML = "";

   
    sphereItems.forEach(item => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "sphereItem";

        div.innerText =
            item.value;

        div.style.color =
            item.color;

      
const lineHeight = 36;

const y =
     -10 +
 item.level * lineHeight;


        div.style.top =
            y + "px";

        div.style.left =
            "50%";

        div.style.transform =
            "translate(-50%,-50%)";

        const length =
            String(
                item.value
            ).length;

        const fontSize =
            Math.max(
              
           

  18,
        36 - length * 0.5


            );

      div.style.fontSize = "24px";
// div.style.fontSize =
 //           fontSize + "px";
       sphere.appendChild(div);

    });
}



// ======================================
// MOVEMENT
// ======================================


function moveForward(step){

    sphereItems.forEach(item=>{
        item.level += step;
    });

    sphereItems =
        sphereItems.filter(
            item => item.level < levelCount
        );

    if(
        sphereItems.length === 0 ||
        sphereItems[0].level >= 1
    ){
        createTopItem();
    }
}


function moveBackward(step){

    sphereItems.forEach(item=>{
        item.level -= step;
    });

    sphereItems =
        sphereItems.filter(
            item => item.level >= 0
        );

    if(
        sphereItems.length === 0 ||
        sphereItems[sphereItems.length-1].level <= levelCount-2
    ){

      
colorIndex =
    (
        colorIndex - 1 +
        colors.length
    )
    %
    colors.length;


const newIndex =

    sphereItems.length === 0
    ? numbers.length - 1
    : nextIndex(
        sphereItems[
            sphereItems.length - 1
        ].index
    );

sphereItems.push({

    index:
        newIndex,

    value:
        String(
            numbers[newIndex]
        ),

    color:
        colors[colorIndex],

    level:
        levelCount - 1

});

    }
}

// ======================================
// SINUSOID
// ======================================

let previousTimestamp = null;

function loop(timestamp){

    if(previousTimestamp === null){
        previousTimestamp = timestamp;
    }

    // Real elapsed time in seconds
    let deltaTime =
        (timestamp - previousTimestamp) / 1000;

    previousTimestamp = timestamp;

    // Prevent a huge jump if the browser stalls
    deltaTime =
        Math.min(deltaTime, 0.05);


   const cycleDuration = 124.121212;


    // Completely time-based sinusoid
    //
    // Math.PI / cycleDuration means:
    // one half-wave in cycleDuration seconds
    // one complete sine cycle in 2 * cycleDuration seconds

    phase +=
        Math.PI *
        deltaTime /
        cycleDuration;


    const wave =
        Math.sin(phase);


    const direction =
        wave >= 0
        ? 1
        : -1;


    const speed =
        Math.abs(wave);


 const minInterval = 121.212121; 
const maxInterval = 242.424242;
const movementScale = 1800;

    const equivalentInterval =
        maxInterval -
        speed *
        (
            maxInterval -
            minInterval
        );


    // ==========================================
    // REAL-TIME MOVEMENT
    // ==========================================

    // Original calibration was:
    //
    // 30 / equivalentInterval per frame
    //
    // At 60 FPS this corresponds to:
    //
    // (30 / equivalentInterval) * 60
    // levels per second.

  const movementSpeed =
    movementScale /
    equivalentInterval;

const step =
    movementSpeed * deltaTime;


    if(direction > 0){

        moveForward(step);

    }
    else{

        moveBackward(step);

    }


    drawSphere();


    requestAnimationFrame(
        loop
    );
}
// ======================================
// FULLSCREEN
// ======================================

function enterFullscreen(){

    if(
      !document.fullscreenElement
    ){

        document
        .documentElement
        .requestFullscreen()
        .catch(()=>{});
    }
}

document.addEventListener(
    "click",
    enterFullscreen,
    {once:true}
);

document.addEventListener(
    "touchstart",
    enterFullscreen,
    {once:true}
);

// ======================================
// START
// ======================================

window.addEventListener(
    "load",
    ()=>{
keepScreenAwake();

  const openedAt = new Date();
    document.getElementById("openTime").textContent =
       openedAt.toLocaleString();    



createBottomStartItem();
drawSphere();

        requestAnimationFrame(
            loop
        );
    }
);
      
let wakeLock = null;

async function keepScreenAwake() {
    try {
        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
            console.log("Wake Lock released");
        });

        console.log("Screen Wake Lock active");

    } catch (err) {
        console.log("Wake Lock error:", err);
    }
}

document.addEventListener("visibilitychange", async () => {

    if (
        wakeLock !== null &&
        document.visibilityState === "visible"
    ) {
        await keepScreenAwake();
    }

});

</script>

</body>
</html>
